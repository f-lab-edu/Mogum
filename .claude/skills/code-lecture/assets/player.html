<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 코드 설명 페이지: 왼쪽 도식 + 설명, 오른쪽 실제 코드 발췌. 단계를 넘기면 도식 강조 · 설명 · 코드 강조 줄이 함께 바뀐다. */
:root {
  --bg: #E9EDF1; --panel: #FBFCFD; --stage: #FFFFFF; --ink: #18212E; --muted: #5A6676;
  --line: #D3DAE2; --line-strong: #9AA6B4;
  --accent: #C25A12; --accent-soft: #FBE7D6;
  --db: #2B58B8; --db-soft: #E1E9F8; --on-db: #FFFFFF;
  --ok: #23794B; --ok-soft: #DDF1E5; --err: #B4332F; --err-soft: #F8E0DE;
  --box-fill: rgba(43, 88, 184, .04); --slack: #E4E8ED;
  --code-bg: #F6F8FA; --hl-bg: #FFF1E4; --inline-code: #EEF1F5;
  --syn-k: #7A3E9D; --syn-s: #1D7A4D; --syn-c: #7B8794; --syn-a: #A3570F; --syn-n: #2B58B8;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --panel: #151C24; --stage: #121920; --ink: #E5EAF0; --muted: #94A1B2;
    --line: #2A3542; --line-strong: #4D5B6B;
    --accent: #F28C3B; --accent-soft: #3B2614;
    --db: #7EA4F2; --db-soft: #18253D; --on-db: #0F141A;
    --ok: #5DC48C; --ok-soft: #14301F; --err: #EE7A72; --err-soft: #3A1A19;
    --box-fill: rgba(126, 164, 242, .05); --slack: #222B35;
    --code-bg: #10161D; --hl-bg: #2E2013; --inline-code: #1E2731;
    --syn-k: #C79BEA; --syn-s: #7FD3A3; --syn-c: #6E7B8A; --syn-a: #F2B36B; --syn-n: #8FB1F5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --panel: #151C24; --stage: #121920; --ink: #E5EAF0; --muted: #94A1B2;
  --line: #2A3542; --line-strong: #4D5B6B;
  --accent: #F28C3B; --accent-soft: #3B2614;
  --db: #7EA4F2; --db-soft: #18253D; --on-db: #0F141A;
  --ok: #5DC48C; --ok-soft: #14301F; --err: #EE7A72; --err-soft: #3A1A19;
  --box-fill: rgba(126, 164, 242, .05); --slack: #222B35;
  --code-bg: #10161D; --hl-bg: #2E2013; --inline-code: #1E2731;
  --syn-k: #C79BEA; --syn-s: #7FD3A3; --syn-c: #6E7B8A; --syn-a: #F2B36B; --syn-n: #8FB1F5;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
.app {
  max-width: 1360px; margin: 0 auto; display: grid; gap: 14px;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; }
.eyebrow { font: 600 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-size: 24px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.where { font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; }
.where b { color: var(--ink); font-weight: 600; }
.where .num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }

.stage { display: grid; gap: 14px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.left { display: grid; gap: 14px; min-width: 0; }
.dia { background: var(--stage); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.dia svg { display: block; width: 100%; height: auto; max-height: 44vh; margin: 0 auto; }
.dia svg.enter { animation: enter .45s ease-out; }
@keyframes enter { from { opacity: .25; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.explain { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px 18px; min-width: 0; }
.explain .chap { font: 600 11px/1.4 var(--mono); letter-spacing: .06em; color: var(--accent); text-transform: uppercase; }
.explain .say { margin: 6px 0 0; font-size: 18px; line-height: 1.6; font-weight: 600; text-wrap: pretty; }
.explain .detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 10px; max-width: 72ch; }
.explain .detail p { margin: 0; font-size: 15.5px; line-height: 1.8; text-wrap: pretty; }
.explain .detail ul { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; font-size: 15.5px; line-height: 1.7; }
.explain code { font: 13px var(--mono); background: var(--inline-code); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.explain strong { font-weight: 700; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.refs span { font: 12px var(--mono); color: var(--db); background: var(--db-soft); border-radius: 999px; padding: 3px 10px; }

.code { position: sticky; top: 14px; height: min(calc(100vh - 28px), 820px); min-width: 0; }
.code .inner { height: 100%; display: flex; flex-direction: column; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.code .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.code .file { font: 600 12px/1.4 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.code .range { font: 12px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.code .body { position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 0 14px; }
.code .empty { padding: 18px; color: var(--muted); font-size: 14px; }
.lines { display: inline-block; min-width: 100%; }
.ln { display: flex; white-space: pre; font: 12.5px/1.7 var(--mono); transition: background .3s; }
.ln .no { flex: none; width: 3.4em; padding-right: 12px; text-align: right; color: var(--muted); opacity: .7; user-select: none; font-variant-numeric: tabular-nums; }
.ln .tx { flex: 1 0 auto; padding-right: 16px; }
.ln.hl { background: var(--hl-bg); box-shadow: inset 3px 0 0 var(--accent); }
.ln.hl .no { color: var(--accent); opacity: 1; }
.tk-k { color: var(--syn-k); } .tk-s { color: var(--syn-s); } .tk-c { color: var(--syn-c); font-style: italic; }
.tk-a { color: var(--syn-a); } .tk-n { color: var(--syn-n); }
.list { padding: 6px 18px 10px; }
.list h3 { margin: 4px 0 10px; font-size: 14px; }
.list ol { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; font-size: 14px; }
.list code { font: 12.5px var(--mono); color: var(--db); }

.bar { display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.segs { display: flex; gap: 3px; height: 10px; }
.seg { flex: 1 1 0; position: relative; border: 0; padding: 0; border-radius: 3px; background: var(--line); cursor: pointer; overflow: hidden; }
.seg i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width .3s; }
.seg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
button.b {
  font: 500 14px var(--sans); color: var(--ink); background: var(--stage); border: 1px solid var(--line-strong);
  border-radius: 8px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
}
button.b:hover:not(:disabled) { border-color: var(--accent); }
button.b:disabled { opacity: .45; cursor: default; }
button.b:focus-visible, .chapters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.next { background: var(--accent); border-color: var(--accent); color: var(--stage); font-weight: 600; }
button.b svg { width: 14px; height: 14px; fill: currentColor; }
.ctrls .grow { flex: 1 1 auto; }
.count { font: 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.keys { font-size: 12.5px; color: var(--muted); }

.chapters { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); margin: 0; padding: 0; list-style: none; }
.chapters button {
  width: 100%; text-align: left; font: 14px var(--sans); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; display: grid; gap: 1px;
}
.chapters button span { font: 11.5px var(--mono); color: var(--muted); }
.chapters button.cur { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.foot { font-size: 12.5px; color: var(--muted); }
.foot code { font-family: var(--mono); }

/* 도식 */
.node rect { fill: var(--stage); stroke: var(--line-strong); stroke-width: 1.2; transition: fill .35s, stroke .35s, stroke-width .35s; }
.node text.l { fill: var(--ink); font: 600 13px var(--sans); }
.node text.l.m { font: 600 12px var(--mono); }
.node text.s { fill: var(--muted); font: 11px var(--mono); }
.node, .edge { transition: opacity .35s; }
.k-db rect { fill: var(--db-soft); stroke: var(--db); }
.k-ext rect { stroke-dasharray: 4 3; }
.k-err rect { fill: var(--err-soft); stroke: var(--err); }
.k-err text.l { fill: var(--err); }
.k-ok rect { fill: var(--ok-soft); stroke: var(--ok); }
.k-ok text.l { fill: var(--ok); }
.k-note rect { fill: none; stroke: var(--line-strong); stroke-dasharray: 3 3; }
.k-later rect { fill: none; stroke: var(--line-strong); stroke-dasharray: 5 4; }
.k-later text { opacity: .7; }
.k-box rect { fill: var(--box-fill); stroke: var(--db); stroke-dasharray: 6 4; stroke-opacity: .7; }
.k-box text.bl { fill: var(--db); font: 600 11px var(--mono); }
.k-held rect { fill: var(--db); stroke: var(--db); }
.k-held text.l { fill: var(--on-db); font-size: 12px; }
.k-free rect { fill: none; stroke: var(--line-strong); stroke-dasharray: 2 3; }
.k-free text.l { fill: var(--muted); font-size: 12px; font-weight: 500; }
.k-slack rect { fill: var(--slack); stroke: var(--line-strong); stroke-dasharray: 3 3; }
.k-cap text { fill: var(--muted); font: 600 11px var(--sans); letter-spacing: .04em; }
.node.on rect { stroke: var(--accent); stroke-width: 2.4; }
.node.on.k-svc rect, .node.on.k-db rect, .node.on.k-ext rect, .node.on.k-note rect,
.node.on.k-later rect, .node.on.k-free rect, .node.on.k-slack rect { fill: var(--accent-soft); }
.node.on.k-box rect { fill: var(--box-fill); stroke: var(--accent); stroke-width: 1.6; }
.node.on.k-box text.bl, .node.on.k-cap text { fill: var(--accent); }
.node.dim { opacity: .4; }
.edge path { fill: none; stroke: var(--muted); stroke-width: 1.4; marker-end: url(#ah); }
.edge.k-dash path { stroke-dasharray: 5 4; }
.edge.k-err path { stroke: var(--err); }
.edge.k-mark path { stroke: var(--ink); stroke-dasharray: 3 3; marker-end: none; }
.edge.on path { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#ah-on); animation: flow .9s linear infinite; }
.edge.on.k-mark path { marker-end: none; }
.edge.dim { opacity: .22; }
.elabel { font: 500 10.5px var(--sans); fill: var(--muted); paint-order: stroke; stroke: var(--stage); stroke-width: 4px; stroke-linejoin: round; }
.edge.on .elabel { fill: var(--accent); font-weight: 600; }
.mk { fill: var(--muted); } .mk-on { fill: var(--accent); }
@keyframes flow { to { stroke-dashoffset: -24; } }

@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .code { position: static; height: 360px; }
  .dia svg { max-height: none; }
  .explain .say { font-size: 17px; }
  h1 { font-size: 21px; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .edge.on path { animation: none; }
  .dia svg.enter { animation: none; }
  * { transition: none !important; }
}
</style>

<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
    </div>
    <div class="where"><span class="num" id="chapNum"></span><b id="chapTitle"></b></div>
  </header>

  <section class="stage">
    <div class="left">
      <div class="dia" id="dia"></div>
      <article class="explain" aria-live="polite">
        <div class="chap" id="beatChap"></div>
        <p class="say" id="say"></p>
        <div class="detail" id="detail"></div>
        <div class="refs" id="refs"></div>
      </article>
    </div>
    <div class="code">
      <div class="inner">
        <div class="head"><span class="file" id="codeFile"></span><span class="range" id="codeRange"></span></div>
        <div class="body" id="codeBody"></div>
      </div>
    </div>
  </section>

  <section class="bar" aria-label="단계 이동">
    <div class="segs" id="segs"></div>
    <div class="ctrls">
      <button class="b" id="prev" type="button"><svg viewBox="0 0 16 16"><path d="M10 2v12L2 8z"/></svg>이전</button>
      <button class="b next" id="next" type="button">다음<svg viewBox="0 0 16 16"><path d="M6 2v12l8-6z"/></svg></button>
      <span class="count" id="count"></span>
      <span class="grow"></span>
      <span class="keys">← → 로 넘기기</span>
    </div>
  </section>

  <ol class="chapters" id="chapters" aria-label="장"></ol>

  <p class="foot" id="foot"></p>
</div>

<script>
const L = /*__LECTURE__*/null;
const SCENES = L.chapters;
const SNIPPETS = L.snippets;
const LISTS = L.lists || {};

// 같은 장 안에서 code 를 적지 않은 단계는 앞 단계의 코드와 강조 줄을 이어 쓴다.
SCENES.forEach(scene => {
  let code = null, hl = [];
  scene.beats.forEach(beat => {
    if (beat.code === undefined) { beat.code = code; if (beat.hl === undefined) beat.hl = hl; }
    else if (beat.hl === undefined) beat.hl = [];
    code = beat.code; hl = beat.hl;
  });
});

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const pad2 = v => String(v).padStart(2, '0');
// 설명 글의 작은 표기: `코드` · **강조**. HTML 은 먼저 이스케이프한다.
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

/* ---------- 도식 ---------- */
function anchor(node, tx, ty) {
  const cx = node.x + node.w / 2, cy = node.y + node.h / 2, dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return [cx, cy];
  const sx = dx ? (node.w / 2) / Math.abs(dx) : Infinity;
  const sy = dy ? (node.h / 2) / Math.abs(dy) : Infinity;
  const k = Math.min(sx, sy);
  return [cx + dx * k, cy + dy * k];
}
function straight(a, b) {
  const [x1, y1] = anchor(a, b.x + b.w / 2, b.y + b.h / 2);
  const [x2, y2] = anchor(b, a.x + a.w / 2, a.y + a.h / 2);
  const len = Math.hypot(x2 - x1, y2 - y1) || 1, p = 2;
  return { d: `M ${(x1 + (x2 - x1) * p / len).toFixed(1)} ${(y1 + (y2 - y1) * p / len).toFixed(1)} L ${(x2 - (x2 - x1) * p / len).toFixed(1)} ${(y2 - (y2 - y1) * p / len).toFixed(1)}`,
    mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
}
function nodeSvg(nd) {
  const k = nd.k || 'svc', cls = `node k-${k}`;
  if (k === 'cap') {
    return `<g class="${cls}" data-node="${nd.id}"><text x="${nd.x}" y="${nd.y}" text-anchor="${nd.align || 'start'}">${esc(nd.l)}</text></g>`;
  }
  let s = `<g class="${cls}" data-node="${nd.id}"><rect x="${nd.x}" y="${nd.y}" width="${nd.w}" height="${nd.h}" rx="7"/>`;
  if (k === 'box') return s + `<text class="bl" x="${nd.x + 10}" y="${nd.y + 16}">${esc(nd.l || '')}</text></g>`;
  const lc = 'l' + (nd.m ? ' m' : '');
  if (nd.i) {
    const y = nd.y + nd.h / 2 + 4.5;
    s += `<text class="${lc}" x="${nd.x + 12}" y="${y}">${esc(nd.l || '')}</text>`;
    if (nd.s) s += `<text class="s" x="${nd.x + nd.w - 12}" y="${y - 0.5}" text-anchor="end">${esc(nd.s)}</text>`;
    return s + '</g>';
  }
  const ls = nd.l ? nd.l.split('\n') : [], ss = nd.s ? nd.s.split('\n') : [];
  const total = ls.length * 17 + ss.length * 15 + (ss.length && ls.length ? 3 : 0);
  let y = nd.y + nd.h / 2 - total / 2 + 12.5;
  const cx = nd.x + nd.w / 2;
  ls.forEach(t => { s += `<text class="${lc}" x="${cx}" y="${y.toFixed(1)}" text-anchor="middle">${esc(t)}</text>`; y += 17; });
  if (ss.length && ls.length) y += 1;
  ss.forEach(t => { s += `<text class="s" x="${cx}" y="${y.toFixed(1)}" text-anchor="middle">${esc(t)}</text>`; y += 15; });
  return s + '</g>';
}
function renderDiagram(scene) {
  const nodes = scene.nodes || [], edges = scene.edges || [];
  const byId = Object.fromEntries(nodes.map(nd => [nd.id, nd]));
  let s = `<svg viewBox="0 0 640 380" role="img" aria-label="${esc(scene.title)} 도식" class="enter">`;
  s += '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>'
    + '<marker id="ah-on" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="mk-on" d="M0,0 L10,5 L0,10 z"/></marker></defs>';
  nodes.filter(nd => nd.k === 'box').forEach(nd => { s += nodeSvg(nd); });
  edges.forEach(ed => {
    const id = ed.id || `${ed.f}-${ed.t}`;
    let d = ed.d, lx = ed.lx, ly = ed.ly;
    if (!d) { const st = straight(byId[ed.f], byId[ed.t]); d = st.d; if (lx === undefined) { lx = st.mx; ly = st.my - 5; } }
    s += `<g class="edge${ed.k ? ' k-' + ed.k : ''}" data-edge="${esc(id)}"><path d="${d}"/>`;
    if (ed.l) s += `<text class="elabel" x="${(+lx).toFixed(1)}" y="${(+ly).toFixed(1)}" text-anchor="middle">${esc(ed.l)}</text>`;
    s += '</g>';
  });
  nodes.filter(nd => nd.k !== 'box').forEach(nd => { s += nodeSvg(nd); });
  return s + '</svg>';
}
function applyFocus(beat) {
  const on = new Set(beat.on || []), eon = new Set(beat.e || []);
  const any = on.size > 0 || eon.size > 0;
  $('dia').querySelectorAll('[data-node]').forEach(g => {
    const hit = on.has(g.dataset.node);
    g.classList.toggle('on', hit);
    g.classList.toggle('dim', any && !hit);
  });
  $('dia').querySelectorAll('[data-edge]').forEach(g => {
    const hit = eon.has(g.dataset.edge);
    g.classList.toggle('on', hit);
    g.classList.toggle('dim', any && !hit);
  });
}

/* ---------- 코드 ---------- */
const JAVA_KW = 'public|private|protected|static|final|return|if|else|for|while|new|var|void|boolean|int|long|double|throw|throws|try|catch|finally|switch|case|default|class|interface|record|enum|this|null|true|false|const|let|function|export|import|from|async|await|type|break|continue|implements|extends|synchronized|instanceof|yield';
const SQL_KW = 'SELECT|FROM|WHERE|AND|OR|INSERT|INTO|VALUES|UPDATE|CREATE|ALTER|ADD|TABLE|PRIMARY|KEY|REFERENCES|ON|DELETE|SET|NULL|NOT|CONSTRAINT|CHECK|IN|INDEX|UNIQUE|DEFAULT|WITH|AS|ORDER|BY|LIMIT|FOR|SKIP|LOCKED|RETURNING|JOIN|LEFT|EXISTS|bigint|bigserial|text|integer|numeric|boolean|timestamptz|jsonb';
const RX = {
  java: new RegExp(`(\\/\\/.*$|\\/\\*.*?\\*\\/)|("(?:[^"\\\\]|\\\\.)*"|'(?:[^'\\\\]|\\\\.)*'|\`[^\`]*\`)|\\b(${JAVA_KW})\\b|(@\\w+)|\\b(\\d+)\\b`, 'g'),
  sql: new RegExp(`(--.*$)|('(?:[^'])*')|\\b(${SQL_KW})\\b|(:\\w+)|\\b(\\d+)\\b`, 'g'),
  yaml: /(#.*$)|("[^"]*"|'[^']*')|^(\s*[\w"\[\].-]+:)|(\b\B)|\b(\d+[a-z]*)\b/g,
  py: /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(def|class|return|if|elif|else|for|while|in|not|and|or|import|from|as|with|try|except|finally|raise|None|True|False|lambda|yield|pass)\b|(@\w+)|\b(\d+)\b/g
};
RX.ts = RX.java;
function hiLine(line, lang) {
  const rx = RX[lang];
  if (!rx) return esc(line);
  rx.lastIndex = 0;
  let out = '', last = 0, m;
  while ((m = rx.exec(line)) !== null) {
    if (m[0] === '') { rx.lastIndex++; continue; }
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'a' : 'n';
    out += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(line.slice(last));
}
let codeKey;
function renderCode(beat) {
  const key = beat.code, body = $('codeBody');
  if (key !== codeKey) {
    codeKey = key;
    if (key && key.startsWith('list:')) {
      const list = LISTS[key.slice(5)];
      $('codeFile').textContent = '요약';
      $('codeRange').textContent = '';
      body.innerHTML = `<div class="list"><h3>${esc(list.title)}</h3><ol>${list.items.map(it => `<li>${inline(it)}</li>`).join('')}</ol></div>`;
    } else if (key) {
      const sn = SNIPPETS[key];
      const indent = Math.min(...sn.lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
      $('codeFile').textContent = sn.file;
      $('codeRange').textContent = `${sn.start}–${sn.start + sn.lines.length - 1}행`;
      body.innerHTML = '<div class="lines">' + sn.lines.map((l, i) =>
        `<div class="ln" data-t="${esc(l)}"><span class="no">${sn.start + i}</span><span class="tx">${hiLine(l.slice(indent), sn.lang) || ' '}</span></div>`).join('') + '</div>';
    } else {
      $('codeFile').textContent = '';
      $('codeRange').textContent = '';
      body.innerHTML = '<p class="empty">이 단계는 코드 없이 도식으로 설명합니다.</p>';
    }
    body.scrollTop = 0;
  }
  const hl = beat.hl || [];
  let first = null;
  body.querySelectorAll('.ln').forEach(el => {
    const hit = hl.some(h => el.dataset.t.includes(h));
    el.classList.toggle('hl', hit);
    if (hit && !first) first = el;
  });
  if (first) {
    const target = Math.max(0, first.offsetTop - body.clientHeight * 0.28);
    try { body.scrollTo({ top: target, behavior: reduced ? 'auto' : 'smooth' }); } catch (_) { body.scrollTop = target; }
  }
}

/* ---------- 설명 ---------- */
function renderExplain(beat) {
  $('beatChap').textContent = `${pad2(si + 1)} · ${SCENES[si].title} · ${bi + 1}/${SCENES[si].beats.length}`;
  $('say').innerHTML = inline(beat.say);
  $('detail').innerHTML = (beat.detail || []).map(p => {
    if (Array.isArray(p)) return `<ul>${p.map(it => `<li>${inline(it)}</li>`).join('')}</ul>`;
    return `<p>${inline(p)}</p>`;
  }).join('');
  $('detail').hidden = !(beat.detail && beat.detail.length);
  $('refs').innerHTML = (beat.refs || []).map(r => `<span>${esc(r)}</span>`).join('');
  $('refs').hidden = !(beat.refs && beat.refs.length);
}

/* ---------- 상태 · 그리기 ---------- */
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOTAL = SCENES.reduce((a, s) => a + s.beats.length, 0);
const POS_KEY = 'lecture-pos:' + L.title;
let si = 0, bi = 0, shownScene = -1;

function store() { try { localStorage.setItem(POS_KEY, JSON.stringify({ si, bi })); } catch (_) {} }
function restore() {
  try {
    const v = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
    if (v && SCENES[v.si] && SCENES[v.si].beats[v.bi]) { si = v.si; bi = v.bi; }
  } catch (_) {}
}

function render() {
  const scene = SCENES[si], beat = scene.beats[bi];
  if (shownScene !== si) {
    $('dia').innerHTML = renderDiagram(scene);
    if (shownScene === -1) $('dia').firstChild.classList.remove('enter');
    shownScene = si;
  }
  applyFocus(beat);
  renderCode(beat);
  renderExplain(beat);
  $('chapNum').textContent = `${pad2(si + 1)} / ${SCENES.length}`;
  $('chapTitle').textContent = scene.title;
  let idx = 0; for (let k = 0; k < si; k++) idx += SCENES[k].beats.length;
  $('count').textContent = `${idx + bi + 1} / ${TOTAL}`;
  $('prev').disabled = si === 0 && bi === 0;
  $('next').disabled = si === SCENES.length - 1 && bi === scene.beats.length - 1;
  document.querySelectorAll('.seg').forEach((sg, k) => {
    const w = k < si ? 100 : k > si ? 0 : ((bi + 1) / scene.beats.length) * 100;
    sg.firstChild.style.width = w + '%';
  });
  document.querySelectorAll('.chapters button').forEach((b, k) => b.classList.toggle('cur', k === si));
  store();
}

function go(s, b) { si = s; bi = b; render(); }
function step(delta) {
  let s = si, b = bi + delta;
  if (b < 0) { if (s === 0) b = 0; else { s--; b = SCENES[s].beats.length - 1; } }
  else if (b >= SCENES[s].beats.length) { if (s < SCENES.length - 1) { s++; b = 0; } else b = SCENES[s].beats.length - 1; }
  go(s, b);
}

function buildChrome() {
  document.title = L.title;
  $('title').textContent = L.title;
  $('eyebrow').textContent = L.eyebrow || '';
  $('foot').innerHTML = inline(L.foot || '');
  $('segs').innerHTML = SCENES.map((s, k) =>
    `<button class="seg" type="button" style="flex-grow:${s.beats.length}" data-k="${k}" title="${pad2(k + 1)} ${esc(s.title)}" aria-label="${pad2(k + 1)} ${esc(s.title)}로 이동"><i></i></button>`).join('');
  $('chapters').innerHTML = SCENES.map((s, k) =>
    `<li><button type="button" data-k="${k}"><span>${pad2(k + 1)} · ${s.beats.length}단계</span>${esc(s.title)}</button></li>`).join('');
  const jump = ev => { const b = ev.target.closest('[data-k]'); if (b) go(+b.dataset.k, 0); };
  $('segs').addEventListener('click', jump);
  $('chapters').addEventListener('click', jump);
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('input, textarea, select')) return;
    if (ev.key === 'ArrowRight') step(1);
    else if (ev.key === 'ArrowLeft') step(-1);
  });
}

buildChrome();
restore();
render();
</script>
