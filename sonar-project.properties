# SonarCloud 스캐너 설정 — 워크플로(.github/workflows/sonarcloud-analyze.yml)가 이 파일을 읽는다.
# docs/design/** : Stitch 화면 시안 사본과 가져오는 도구(참고 자료 · 운영 코드 아님). 받은 그대로 두므로 고치지 않는다 — docs/design/README.md
# **/*.jar      : gradle-wrapper.jar 같은 바이너리를 텍스트로 읽어 인코딩 경고가 난다
# backend/src/main/resources/db/migration/** : PostgreSQL 마이그레이션. SonarCloud 는 .sql 을 Oracle PL/SQL 로 분석해 VARCHAR2 처럼 PostgreSQL 에 없는 지적을 낸다
sonar.exclusions=docs/design/**,**/*.jar,backend/src/main/resources/db/migration/**

# 백엔드 테스트의 java:S4036(PATH 로 명령 찾기) : 배포 스크립트 테스트는 PATH 맨 앞에 가짜 aws · docker 명령 디렉터리를 두고
# `bash` · `tar` 를 이름으로 실행해 스크립트를 돌려 본다 — PATH 조회가 테스트 방식 그 자체다. 운영에 실리지 않는 코드이고, 운영 코드에는 그대로 적용한다
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/src/test/**

# 테스트 DB 정리기의 java:S2077(동적 SQL) : 테스트마다 모든 테이블을 TRUNCATE 한 문장으로 비운다(docs/TEST_GUIDE.md §5 · ADR-179).
# 테이블 이름은 JDBC 바인드 변수로 넘길 수 없어 문장에 이어 붙이며, 붙이는 값은 DB 카탈로그(pg_tables)에서 quote_ident 로 받은 것뿐이다 —
# 외부 입력이 들어갈 길이 없다. 운영에 실리지 않는 이 파일 하나에만 끈다
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S2077
sonar.issue.ignore.multicriteria.e2.resourceKey=backend/src/test/java/com/mogum/support/DatabaseCleaner.java
