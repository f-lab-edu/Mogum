plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.mogum'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // Lombok — 엔티티의 @Getter · @NoArgsConstructor(access = PROTECTED)만 쓴다(ADR-070). 애노테이션 프로세서에도 BOM 을 걸어야 버전이 정해진다
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.yaml:snakeyaml'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testImplementation 'io.github.open-spaced-repetition:fsrs:1.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def fakeGoogleCredentials = [
    GOOGLE_CLIENT_ID: 'test-google-client',
    GOOGLE_CLIENT_SECRET: 'test-only-not-a-real-secret'
]

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // 모든 SpringBootTest는 실제 Google 비밀 없이 main 설정을 그대로 읽는다.
    systemProperties fakeGoogleCredentials
}

tasks.named('test') {
    exclude '**/*ImageIT.class'
    inputs.dir('../deploy')
    inputs.dir('../.github/workflows')
}

def suppliedAppImage = providers.gradleProperty('appImage')
def localAppImage = 'mogum-app:image-test'
def buildTestImage = tasks.register('buildTestImage', Exec) {
    description = 'Builds the local app image with Docker CLI (BuildKit).'
    workingDir projectDir
    commandLine 'docker', 'build', '-t', localAppImage, '.'
}

tasks.register('imageTest', Test) {
    group = 'verification'
    description = 'Checks app image startup, health, non-root Java and SIGTERM exit; accepts -PappImage.'
    if (!suppliedAppImage.isPresent()) {
        dependsOn buildTestImage
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*ImageIT.class'
    systemProperty 'appImage', suppliedAppImage.getOrElse(localAppImage)
    // 같은 태그의 이미지 내용이 바뀔 수 있으므로 매번 실제 컨테이너를 검사한다.
    outputs.upToDateWhen { false }
}
