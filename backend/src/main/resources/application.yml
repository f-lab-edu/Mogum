spring:
  application:
    name: mogum
  lifecycle:
    timeout-per-shutdown-phase: 130s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mogum}
    username: ${DB_USERNAME:mogum_local}
    password: ${DB_PASSWORD:mogum_local}
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.json_format_mapper: jackson3
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email,profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/google/callback}

logging:
  level:
    org.springframework.web.servlet.PageNotFound: OFF
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"
    level: "%5p %X"

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: false

app:
  worker:
    count: 2
    poll-interval: 1s
    shutdown-wait: 100s
    lease-duration: 5m
    renewal-interval: 30s
    max-retries: 2
    retry-delay: 1s
  job:
    max-in-progress-per-user: 3
  credit:
    monthly-amount: 100
    new-course: 1
    new-roadmap: 1
    plan-roadmap-course: 1
    replan-course: 1
    replan-roadmap: 1
    material: 1
  web:
    origin: ${APP_WEB_ORIGIN:http://localhost:5173}
    cookie-domain: ${APP_WEB_COOKIE_DOMAIN:}
