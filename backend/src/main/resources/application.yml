spring:
  application:
    name: mogum
  lifecycle:
    timeout-per-shutdown-phase: 130s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mogum}
    username: ${DB_USERNAME:mogum_local}
    password: ${DB_PASSWORD:mogum_local}
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/google/callback}

logging:
  level:
    org.springframework.web.servlet.PageNotFound: OFF
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX,Asia/Seoul"
    level: "%5p %X"

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: false

app:
  web:
    origin: ${APP_WEB_ORIGIN:http://localhost:5173}
    cookie-domain: ${APP_WEB_COOKIE_DOMAIN:}
  auth:
    admin-emails: ${APP_AUTH_ADMIN_EMAILS:}
