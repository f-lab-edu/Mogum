plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.mogum'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testImplementation 'io.github.open-spaced-repetition:fsrs:1.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def npmCi = tasks.register('npmCi', Exec) {
    workingDir 'frontend'
    commandLine 'npm', 'ci'
    inputs.files('frontend/package.json', 'frontend/package-lock.json')
    outputs.dir('frontend/node_modules')
}

def frontendBuild = tasks.register('frontendBuild', Exec) {
    dependsOn npmCi
    workingDir 'frontend'
    commandLine 'npm', 'run', 'build'
    inputs.dir('frontend/src')
    inputs.files('frontend/index.html', 'frontend/package.json', 'frontend/package-lock.json')
    inputs.files(fileTree('frontend') {
        include 'vite.config.*', 'tsconfig*.json'
    })
    inputs.files(fileTree('frontend/public'))
    outputs.dir('frontend/dist')
}

tasks.named('processResources') {
    from(frontendBuild) {
        into 'static'
    }
}

def bootJar = tasks.named('bootJar')
def verifyFrontendBundle = tasks.register('verifyFrontendBundle') {
    dependsOn bootJar
    inputs.file(bootJar.flatMap { it.archiveFile })
    doLast {
        new java.util.zip.ZipFile(bootJar.get().archiveFile.get().asFile).withCloseable { jar ->
            if (jar.getEntry('BOOT-INF/classes/static/index.html') == null) {
                throw new GradleException('실행 jar에 static/index.html이 없습니다.')
            }
        }
    }
}

tasks.named('check') {
    dependsOn verifyFrontendBundle
}
